name: IRIS Injection
description: Inject IRIS app into rootfs image
 
inputs:
  machine:
    description: Target machine name
    required: true
  docker_image:
    description: Docker image name
    required: true
 
runs:
  using: "composite"
  steps:
    - name: Create top-level images directory
      shell: bash
      run: |
        mkdir -p ${{ github.workspace }}/images
 
    - name: Run IRIS injection in Docker
      shell: bash
      run: |
        USER_ID=$(id -u)
        GROUP_ID=$(id -g)
        MACHINE="${{ inputs.machine }}"
        image_dir="build/tmp/deploy/images/${MACHINE}/qcom-multimedia-proprietary-image-${MACHINE}.rootfs.qcomflash"
        echo "$image_dir"

        docker run --rm \
          -v $PWD:/workspace \
          -w /workspace \
          -e "IMAGE_DIR=$image_dir" \
          --privileged \
          ${{ inputs.docker_image }} \
          bash -c '
            set -eux
            cd "$IMAGE_DIR"
            ls -l rootfs.img
            mkdir -p /tmp/rootfs
            sudo mount rootfs.img /tmp/rootfs
            cd /tmp/rootfs
            mkdir -p data/vendor/iris_test_app/input
            mkdir -p data/vendor/iris_test_app/output
            cd -
            cp /workspace/v4l-video-test-app/build/iris_v4l2_test /tmp/rootfs/data/vendor/iris_test_app/
            chmod +x /tmp/rootfs/data/vendor/iris_test_app/iris_v4l2_test
            sync
 
            ls -l /tmp/rootfs/data/vendor/iris_test_app
            sudo umount /tmp/rootfs
            ls -l rootfs.img
 
            echo \"✅ IRIS injection completed for \$MACHINE.\"
          '
